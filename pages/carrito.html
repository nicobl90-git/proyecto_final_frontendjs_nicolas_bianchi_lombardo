<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Revisá y editá los libros de tu carrito de compras en Universo de los Seres.">
    <title>Carrito | Universo de los Seres</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="#contenido-principal" class="skip-link">Saltar al contenido principal</a>
        <img src="../img/banner.jpg" alt="Logo del Universo de los Seres" width="150">
        <h1>Tu carrito</h1>
        <p id="saludo"></p> <!-- Agrego este saludo para que el archivo JS lo encuentre despues -->
    </header>

    <section aria-labelledby="titulo-preferencias">
            <h2 id="titulo--preferencias" class="titulo">PERSONALIZÁ TU VISITA</h2>
            <form id="form-preferencias">
            <p id="aviso-preferencias" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
                <label for="nombre">Nombre (obligatorio):</label>
                <input type="text" id="nombre" required>

                <label for="color">Color de fondo:</label>
                <select id="color">
                    <option value="white">Blanco</option>
                    <option value="lightblue">Celeste</option>
                    <option value="lightgreen">Verde</option>
                    <option value="lightyellow">Amarillo</option>
                    <option value="lightpink">Rosa</option>
                </select>

                <button type="submit">Guardar preferencias</button>
                <button type="button" id="btn-reset">Restablecer</button>
            </form>
    </section>

    <nav>
        <ul class="nav-list">
            <li><a href="../index.html">INICIO</a></li>
            <li><a href="../pages/producto.html">PRODUCTOS</a></li>
            <li><a href="../pages/contacto.html">CONTACTO</a></li>
            <li>
                <a href="../pages/carrito.html" class="carrito" id="enlace-carrito" aria-label="Ver carrito de compras, 0 productos">
                    <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
                    <span id="contador-carrito" aria-hidden="true">0</span>
                </a>
            </li>
        </ul>
    </nav>

    <main id="contenido-principal" tabindex="-1">
        <section class="carrito-seccion" aria-labelledby="titulo-lista">
            <h2 id="titulo-lista">Productos agregados</h2>
            <ul id="lista-carrito"></ul>
            <p>Total: $<span id="total-carrito">0.00</span></p>
            <button type="button" id="vaciar-carrito">Vaciar carrito</button>
        </section>
    </main>

    <footer>
        <p>Síguenos en nuestras redes sociales:</p>
        <a href="https://web.whatsapp.com/" aria-label="Se abre el WhatsApp del autor en otra pestaña" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-square-whatsapp" aria-hidden="true"></i>
        </a>
        <a href="https://www.instagram.com/nicolombardo_escritor/?hl=es-la" aria-label="Se abre el Instagram del autor en otra pestaña" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </a>
        <a href="https://www.youtube.com/" aria-label="Se abre el canal de Youtube del autor en otra pestaña" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-youtube" aria-hidden="true"></i>
        </a>
    </footer>

    <script src="../javascript/script.js"></script>
</body>
</html>
