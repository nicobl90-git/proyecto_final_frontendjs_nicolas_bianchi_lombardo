<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactate con el Universo de los Seres: escribinos tu consulta o mensaje.">
    <title>Contacto | Página para contactarse con nosotros</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img src="../img/banner.jpg" alt="Logo del Universo de los Seres" width="150">
        <h1>Bienvenido al Universo de los Seres</h1>
        <p id="saludo"></p> <!-- Agrego este saludo para que el archivo JS lo encuentre despues -->
    </header>
    <nav>
        <ul class="nav-list">
            <li><a href="../index.html">INICIO</a></li>
            <li><a href="../pages/producto.html">PRODUCTOS</a></li>
            <li><a href="../pages/contacto.html">CONTACTO</a></li>
            <li><a href="../pages/carrito.html" class="carrito" aria-label="Ver carrito de compras">
                    <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
                    <span id="contador-carrito">0</span>
                </a></li>
        </ul>
    </nav>
    <main>
        <section>
            <h2 class="titulo">PERSONALIZÁ TU VISITA</h2>
            <form id="form-preferencias">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>

                <label for="color">Color de fondo:</label>
                <select id="color">
                    <option value="white">Blanco</option>
                    <option value="lightblue">Celeste</option>
                    <option value="lightgreen">Verde</option>
                    <option value="lightyellow">Amarillo</option>
                    <option value="lightpink">Rosa</option>
                </select>

                <button type="submit">Guardar preferencias</button>
                <button type="button" id="btn-reset">Restablecer</button>
            </form>
        </section>

        <section class="titulo"> 
            <h2>CONTACTO</h2>
            <p>
                Bienvenido a la sección de contacto.
            </p>
        </section>

        <section class="titulo"> 
            <h2>FORMULARIO DE CONTACTO</h2>
            <p>
                Llene los campos del formulario para contactarnos.
            </p>
        </section>

        <section class="form-and-table">
            <form id="form-contacto" action="https://formspree.io/f/mnpqdnaw" method="POST" novalidate>
                <fieldset class="input-form">
                    <legend>Datos de contacto</legend>

                    <label for="nombre-contacto">Nombre:</label>
                    <input type="text" id="nombre-contacto" name="nombre" autocomplete="name">
                    <p class="error" id="error-nombre" role="alert"></p>

                    <label for="email-contacto">Correo electrónico:</label>
                    <input type="email" id="email-contacto" name="email" autocomplete="email">
                    <p class="error" id="error-email" role="alert"></p>

                    <label for="mensaje-contacto">Mensaje:</label>
                    <textarea id="mensaje-contacto" name="mensaje" rows="4" cols="50"></textarea>
                    <p class="error" id="error-mensaje" role="alert"></p>

                    <button class="btn bg-primario" type="submit">Enviar</button>
                </fieldset>
            </form>
            <script src="../javascript/script.js"></script> 
        </section>


    </main>
    <footer>
        <p>Síguenos en nuestras redes sociales:</p>
        <a href="https://web.whatsapp.com/" aria-label="WhatsApp" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-square-whatsapp" aria-hidden="true"></i>
        </a>
        <a href="https://www.instagram.com/nicolombardo_escritor/?hl=es-la" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </a>
        <a href="https://www.youtube.com/" aria-label="YouTube" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-youtube" aria-hidden="true"></i>
        </a>
    </footer>
    <script src="../javascript/script.js"></script>
</body>
</html>
